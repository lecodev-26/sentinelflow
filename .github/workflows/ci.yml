name: SentinelFlow CI

on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)" || {
            echo "Go files are not formatted. Run: gofmt -w ."
            exit 1
          }

      - name: Check Git diff
        run: git diff --check

      - name: Run unit and integration tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build production binaries
        run: |
          go build ./cmd/gateway
          go build ./cmd/controlplane
          go build ./cmd/worker
          go build ./cmd/cli
          go build ./cmd/migrator

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan Go dependencies and code
        run: govulncheck ./...
