name: SentinelFlow CI

on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)" || {
            echo "Go files are not formatted. Run: gofmt -w ."
            exit 1
          }

      - name: Check Git diff
        run: git diff --check

      - name: Run unit and integration tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build production binaries
        run: |
          go build ./cmd/gateway
          go build ./cmd/controlplane
          go build ./cmd/worker
          go build ./cmd/cli
          go build ./cmd/migrator

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan Go dependencies and code
        run: govulncheck ./...

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinelflow
          POSTGRES_PASSWORD: sentinelflow
          POSTGRES_DB: sentinelflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelflow -d sentinelflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SENTINELFLOW_DATABASE_URL: postgres://sentinelflow:sentinelflow@localhost:5432/sentinelflow?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Apply database migrations
        run: go run ./cmd/migrator up

      - name: Run V6 runtime integration tests against PostgreSQL
        run: go test ./internal/runtime/v6 -count=1
