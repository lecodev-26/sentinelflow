apiVersion: apps/v1
kind: Deployment
metadata: {name: sentinelflow}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: sentinelflow}}
  template:
    metadata: {labels: {app: sentinelflow}}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{containerPort: 8080}]
          env:
            - name: SENTINELFLOW_ENV
              value: "{{ .Values.env.SENTINELFLOW_ENV }}"
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: sentinelflow}
spec:
  selector: {app: sentinelflow}
  ports: [{port: 8080, targetPort: 8080}]
