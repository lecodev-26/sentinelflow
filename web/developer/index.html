<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SentinelFlow Developer Portal</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#e8edf7}main{max-width:1100px;margin:auto;padding:32px}nav{display:flex;gap:10px;margin:24px 0;flex-wrap:wrap}button{background:#536dfe;color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}.card{background:#141b31;border:1px solid #263252;border-radius:12px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}pre{background:#090d18;padding:16px;border-radius:8px;overflow:auto}.muted{color:#9ba8c4}input{margin:4px}</style></head><body><main><h1>SentinelFlow Developer Portal</h1><p class="muted">Models, providers, usage and API integration.</p><div class="card"><input id="base" placeholder="Gateway URL" value=""><input id="key" placeholder="API key" type="password"><button onclick="loadModels()">Connect</button></div><nav><button onclick="loadModels()">Models</button><button onclick="loadProviders()">Providers</button><button onclick="loadUsage()">Usage</button><button onclick="docs()">API Docs</button></nav><section id="content"></section><script>const $=x=>document.getElementById(x),base=()=>($('base').value||location.origin).replace(/\/$/,''),headers=()=>({Authorization:'Bearer '+$('key').value});async function get(p){let r=await fetch(base()+p,{headers:headers()});if(!r.ok)throw Error(r.status+' '+await r.text());return r.json()}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function show(e){$('content').innerHTML='<div class="card"><h2>Request failed</h2><pre>'+esc(String(e))+'</pre></div>'}async function loadModels(){try{let d=await get('/v1/models');$('content').innerHTML='<div class="card"><h2>Models</h2><div class="grid">'+d.data.map(m=>'<div class="card"><b>'+esc(m.id)+'</b><p>'+esc(m.provider)+'</p><span class="muted">context '+m.context+'</span></div>').join('')+'</div></div>'}catch(e){show(e)}}async function loadProviders(){try{let d=await get('/v1/providers');$('content').innerHTML='<div class="card"><h2>Providers</h2><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>'}catch(e){show(e)}}async function loadUsage(){try{let d=await get('/v1/analytics/daily?days=30');$('content').innerHTML='<div class="card"><h2>Usage</h2><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>'}catch(e){show(e)}}function docs(){$('content').innerHTML='<div class="card"><h2>Quick start</h2><pre>curl $GATEWAY/v1/chat/completions \\\n -H "Authorization: Bearer $SENTINELFLOW_API_KEY" \\\n -H "Content-Type: application/json" \\\n -d \'{"model":"MODEL","messages":[{"role":"user","content":"Hello"}]}\'</pre></div>'}</script></main></body></html>
