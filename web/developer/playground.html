<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SentinelFlow Playground</title><style>body{font-family:system-ui;background:#0b1020;color:#e8edf7;margin:0}main{max-width:1100px;margin:auto;padding:28px}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,textarea{background:#10182b;color:#fff;border:1px solid #2b395c;border-radius:8px;padding:10px}input{flex:1}textarea{width:100%;min-height:160px}button{background:#536dfe;color:#fff;border:0;border-radius:8px;padding:10px 16px}.card{background:#141b31;border:1px solid #263252;border-radius:12px;padding:18px;margin:14px 0}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main><h1>SentinelFlow Playground</h1><div class="card"><div class="row"><input id="base" placeholder="Gateway URL"><input id="key" placeholder="API key" type="password"><select id="endpoint"><option value="/v1/chat/completions">Chat Completions</option><option value="/v1/responses">Responses</option></select><select id="model"><option>loading...</option></select></div><br><textarea id="prompt" placeholder="Enter a prompt"></textarea><br><button onclick="run()">Run</button></div><div class="card"><h3>Result</h3><pre id="out"></pre></div></main><script>const $=x=>document.getElementById(x);const base=()=>($('base').value||location.origin).replace(/\/$/,'');async function models(){try{let r=await fetch(base()+'/v1/models',{headers:{Authorization:'Bearer '+$('key').value}});let d=await r.json();$('model').innerHTML=d.data.map(x=>'<option>'+x.id+'</option>').join('')}catch(e){$('model').innerHTML='<option>configure gateway</option>'}}$('key').addEventListener('change',models);async function run(){let ep=$('endpoint').value,p=$('prompt').value,m=$('model').value;let body=ep.includes('responses')?{model:m,input:p}:{model:m,messages:[{role:'user',content:p}]};$('out').textContent='Running...';try{let r=await fetch(base()+ep,{method:'POST',headers:{Authorization:'Bearer '+$('key').value,'Content-Type':'application/json'},body:JSON.stringify(body)});$('out').textContent=JSON.stringify(await r.json(),null,2)}catch(e){$('out').textContent=String(e)}}models()</script></body></html>
