apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinelflow.fullname" . }}
  labels:
    {{- include "sentinelflow.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sentinelflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinelflow.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- if .Values.secrets.openai.apiKey }}
            - name: OPENAI_API_KEY
              value: {{ .Values.secrets.openai.apiKey }}
            {{- end }}
            {{- if .Values.secrets.anthropic.apiKey }}
            - name: ANTHROPIC_API_KEY
              value: {{ .Values.secrets.anthropic.apiKey }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /configs
      volumes:
        - name: config
          configMap:
            name: {{ include "sentinelflow.fullname" . }}-config
