global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'component']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://sentinelflow:8081/v1/alerts'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://sentinelflow:8081/v1/alerts'
        send_resolved: true

  - name: 'warning'
    webhook_configs:
      - url: 'http://sentinelflow:8081/v1/alerts'
        send_resolved: true
