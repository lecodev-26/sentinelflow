apiVersion: v1
kind: Namespace
metadata:
  name: sentinelflow
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sentinelflow-limits
  namespace: sentinelflow
spec:
  limits:
  - max:
      cpu: "1"
      memory: "1Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
    type: Container
