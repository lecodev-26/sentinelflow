apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelflow
  namespace: default
  labels:
    app: sentinelflow
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinelflow
  template:
    metadata:
      labels:
        app: sentinelflow
    spec:
      containers:
      - name: sentinelflow
        image: sentinelflow:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: anthropic-secret
              key: api-key
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /configs
      volumes:
      - name: config
        configMap:
          name: sentinelflow-config
