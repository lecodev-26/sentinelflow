apiVersion: v1
kind: Service
metadata:
  name: sentinelflow-service
  namespace: default
  labels:
    app: sentinelflow
spec:
  selector:
    app: sentinelflow
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelflow-lb
  namespace: default
  labels:
    app: sentinelflow
spec:
  selector:
    app: sentinelflow
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: LoadBalancer
