apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelflow-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - sentinelflow.example.com
    secretName: sentinelflow-tls
  rules:
  - host: sentinelflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sentinelflow-service
            port:
              number: 8080
